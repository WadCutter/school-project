<script>
$(document).ready(function() 
{
	var db = setInterval('checkRequest()',1000*10);	
	var time, abc;
    time = setInterval('digitized()', 1000);
    abc = setInterval('getINOUTDATA()', 60000);
	var pressed = false; 
	var chars = []; 	
	$(window).keypress(function(e) {
    if (e.which >= 48 && e.which <= 57) {
	            chars.push(String.fromCharCode(e.which));
	 }
	 if (pressed == false) {
	 	setTimeout(function(){
	                if (chars.length >= 10) {
	                    var barcode = chars.join("");
	                    getRFID_TAGS(barcode);
	                    $('#_display').trigger('click');
	                }
	                chars = [];
	                pressed = false;
	            },500);
	        }
	        pressed = true;
	    });
});
function toastMe(text) 
{	
    JSInterface.toastMe(text);
}
function getINOUTDATA()
{
	$.ajax({
		method : "POST",
		url : "inout-manager.jsp",
		data : {cmd : "inoutdata", bid : $('#bid').val()}
		
	}).done(function(msg){
		$('#inoutdata').val(msg);
	});
}
function getRFID_TAGS(a)
{
		var url_cmd = "get_rfid_stu_new";
		var inoutdata = $('#inoutdata').val().split('#');
		$('#_display').html('<img src="img/loader.gif" style="weight : 100px;"/>').fadeIn();
		if($('#inoutdata').val()!="")
		{			
			var t1 = $('#wave_time').val();
			if(t1>=inoutdata[2])
				url_cmd = "get_rfid_stu_out_new";
		}
		var d = new Date();
			$.ajax({
		 		method : "POST",
		 		url : "getRfid.jsp",
		 		data : {cmd : url_cmd, tags : a, adate : d.yyyymmdd(), uid : $('#hid').val(), wave_time : $('#wave_time').val(), intime_end : inoutdata[1], outtime_end : inoutdata[3], announcementSetting : $('#announcementSetting').val()},		 		
			    success: function (msg) {		
			   		$('#_display').html(msg.trim()).fadeIn();		 			
		 			$('#_display').delay(3000).fadeOut();
		 			info('INFORMATION',$('#toast').val(),$('#headname').val());
		 			JSInterface.toastMe($('#toastMsg').val()); 
		 			$('#_queue tr:last').after($('#queueinfo').val());      		
			    },
			     error: function (e) {
			     	$('#_display').html(msg.trim()).fadeIn();		 			
		 			$('#_display').delay(1500).fadeOut();	 			
		 			info('INFORMATION',e.responseText,'error');			     			
			     }
		 	});
		 	
}
function checkRequest()
{
	$.ajax({
		method : "POST",
		url	: "getRfid.jsp",
		data : $('#md5').serialize()
	}).done(function(msg){
		var data = msg.split("#");
		for(var i = 0; i < data.length-1; i++)
		{
			var b= data[i].trim().split('_');
			JSInterface.toastMe("Token number "+b[1]); 
			$('#queueid_'+b[0]).remove();
		}	
	});

}
function info(a,b,c)
	{		
		$.toast({
			    heading: a,
			    text: b,
			    icon: c,
			    loader: true,
			    hideAfter: 5000, 
			    position: 'bottom-right',
    			showHideTransition: 'plain',
    			stack: 7
    			
			});	
	}
Date.prototype.yyyymmdd = function() {                               
        var yyyy = this.getFullYear().toString();                                    
        var mm = (this.getMonth()+1).toString(); // getMonth() is zero-based         
        var dd  = this.getDate().toString();                             
        return yyyy + '-' + (mm[1]?mm:"0"+mm[0]) + '-' + (dd[1]?dd:"0"+dd[0]);
   };

</script> 


<script>
    // OUR FUNCTION WHICH IS EXECUTED ON LOAD OF THE PAGE.
    function digitized() {
        var dt = new Date();    // DATE() CONSTRUCTOR FOR CURRENT SYSTEM DATE AND TIME.
        var hrs = dt.getHours();
        var min = dt.getMinutes();
        var sec = dt.getSeconds();

        min = Ticking(min);
        sec = Ticking(sec);

        document.getElementById('dc').innerHTML = Ticking(hrs) + ":" + min;
        document.getElementById('dc_second').innerHTML = sec;
        
        $('#wave_time').val(Ticking(hrs) + ":" + min + ":" + sec);

        if (hrs > 12) { 
            document.getElementById('dc_hour').innerHTML = 'PM'; 
        }
        else { 
            document.getElementById('dc_hour').innerHTML = 'AM'; 
        }

        // CALL THE FUNCTION EVERY 1 SECOND (RECURSION).
        
    }

    function Ticking(ticVal) {
        if (ticVal < 10) {
            ticVal = "0" + ticVal;
        }
        return ticVal;
    }
</script>
