<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Split QR Code Generator</title>
    <!-- Standalone Client-Side Pure JS QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-light: #eef2ff;
            --accent-border: #c7d2fe;
            --error-bg: #fef2f2;
            --error-text: #991b1b;
            --error-border: #fecaca;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        /* Header Styling */
        header {
            background-color: #1e1b4b;
            color: #ffffff;
            padding: 20px 16px;
            text-align: center;
            border-bottom: 1px solid #312e81;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        header p {
            font-size: 0.875rem;
            color: #c7d2fe;
            margin-top: 4px;
        }

        /* Container Layout */
        .main-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 24px 16px;
            flex-grow: 1;
        }

        /* Form Card */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .currency-symbol {
            position: absolute;
            left: 14px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-muted);
            pointer-events: none;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 14px 12px 36px;
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-main);
            background-color: #f8fafc;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* Config Pill */
        .config-pill {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.825rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .config-pill strong {
            color: var(--text-main);
        }

        /* Button */
        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            padding: 14px 20px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: var(--shadow);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        /* Error Box */
        .error-box {
            display: none;
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            margin-bottom: 24px;
        }

        /* Summary Panel */
        .summary-panel {
            display: none;
            background-color: var(--accent-light);
            border: 1px solid var(--accent-border);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            text-align: center;
        }

        .summary-item .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary-color);
            font-weight: 700;
        }

        .summary-item .value {
            font-size: 1.125rem;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 2px;
        }

        /* Vertical Stacked QR Cards */
        .qr-stack {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .qr-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .qr-badge {
            background-color: var(--accent-light);
            color: var(--primary-color);
            font-size: 0.775rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--accent-border);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .qr-amount {
            font-size: 1.875rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .qr-canvas-container {
            background-color: #ffffff;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            display: inline-block;
        }

        .qr-details {
            width: 100%;
            max-width: 480px;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px;
            text-align: left;
        }

        .qr-details-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .qr-uri {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-main);
            word-break: break-all;
            background-color: #ffffff;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background-color: var(--card-bg);
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .summary-panel {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .qr-amount {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>UPI Split QR Generator</h1>
        <p>Auto-split large payments into multiple compliant QR codes</p>
    </header>

    <!-- Main Content Container -->
    <main class="main-container">
        
        <!-- Input Form Card -->
        <div class="card">
            <form id="qrForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label for="totalAmount">Enter Total Payment Amount (₹)</label>
                    <div class="input-wrapper">
                        <span class="currency-symbol">₹</span>
                        <input 
                            type="number" 
                            id="totalAmount" 
                            name="totalAmount" 
                            step="any" 
                            min="1" 
                            placeholder="e.g. 5000" 
                            required 
                            autofocus
                        >
                    </div>
                </div>

                <div class="config-pill">
                    <span>Max QR Limit: <strong id="limitDisplay">₹0.00</strong></span>
                    <span>Backend Configured</span>
                </div>

                <button type="submit" class="btn-submit">Generate Split QR Codes</button>
            </form>
        </div>

        <!-- Error Feedback Message Box -->
        <div id="errorBox" class="error-box"></div>

        <!-- Summary Panel (Hidden by default) -->
        <div id="summaryPanel" class="summary-panel" style="display: none;">
            <div class="summary-item">
                <div class="label">Total Amount</div>
                <div class="value" id="summaryTotal">₹0.00</div>
            </div>
            <div class="summary-item">
                <div class="label">Total QRs</div>
                <div class="value" id="summaryCount">0</div>
            </div>
            <div class="summary-item">
                <div class="label">Max QR Limit</div>
                <div class="value" id="summaryLimit">₹0.00</div>
            </div>
        </div>

        <!-- Vertically Stacked Generated QR Codes -->
        <div id="qrStack" class="qr-stack"></div>

    </main>

    <!-- Footer Section -->
    <footer>
        <p>UPI Payment Splitter Utility &bull; Standard Client-Side Processing</p>
    </footer>

    <!-- JavaScript Logic Section -->
    <script>
        /**
         * BACKEND CONFIGURATION CONSTANTS
         * Easily edit these hardcoded values directly in the source code as required.
         */
        const CONFIG = {
            // Base UPI URI without the am parameter
            BASE_UPI_URI: "upi://pay?pa=bsdac94157538@barodampay&pn=B%20S%20D%20ACADEMY&mc=&tn=Verified%20Merchant&cu=INR&url=&mode=02&orgid=159012&mid=&msid=&mtid=&sign=MEYCIQCyRLFeYqOxymfA2JmNGr8h9mlp50Nd+aXlQ4l8EYow5wIhAMdmu9lgbhjZqRTQU+GNY9RDfFqOOLBQn0XTswBDLqbq",
            // Maximum limit allowed per individual QR code
            MAX_LIMIT: 2000
        };

        /**
         * Initialize page values on load
         */
        document.addEventListener("DOMContentLoaded", () => {
            const limitDisplay = document.getElementById("limitDisplay");
            if (limitDisplay) {
                limitDisplay.textContent = formatCurrency(CONFIG.MAX_LIMIT);
            }
        });

        /**
         * Helper utility for formatting numbers into INR currency format
         */
        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR',
                maximumFractionDigits: 2
            }).format(amount);
        }

        /**
         * Form Submit Event Handler
         */
        function handleFormSubmit(event) {
            event.preventDefault();

            const amountInput = document.getElementById("totalAmount");
            const qrStack = document.getElementById("qrStack");
            const summaryPanel = document.getElementById("summaryPanel");
            const errorBox = document.getElementById("errorBox");

            // Reset UI states
            qrStack.innerHTML = "";
            errorBox.style.display = "none";
            summaryPanel.style.display = "none";

            const totalAmount = parseFloat(amountInput.value);

            // Validation Check
            if (isNaN(totalAmount) || totalAmount <= 0) {
                errorBox.textContent = "Please enter a valid amount greater than 0.";
                errorBox.style.display = "block";
                return;
            }

            // Split logic into chunks based on CONFIG.MAX_LIMIT
            const chunks = [];
            let remaining = totalAmount;

            while (remaining > 0) {
                if (remaining >= CONFIG.MAX_LIMIT) {
                    chunks.push(CONFIG.MAX_LIMIT);
                    remaining = parseFloat((remaining - CONFIG.MAX_LIMIT).toFixed(2));
                } else {
                    chunks.push(remaining);
                    remaining = 0;
                }
            }

            // Update & Show Summary Panel
            document.getElementById("summaryTotal").textContent = formatCurrency(totalAmount);
            document.getElementById("summaryCount").textContent = chunks.length;
            document.getElementById("summaryLimit").textContent = formatCurrency(CONFIG.MAX_LIMIT);
            summaryPanel.style.display = "grid";

            // Render Vertically Stacked QR Codes
            chunks.forEach((chunkAmount, index) => {
                const partIndex = index + 1;
                const totalParts = chunks.length;
                const formattedAmount = chunkAmount.toFixed(2);
                
                // Construct full UPI String with appended amount parameter
                const fullUpiUri = `${CONFIG.BASE_UPI_URI}&am=${formattedAmount}`;

                // Create QR Card Element
                const card = document.createElement("div");
                card.className = "qr-card";

                // Badge Indicator
                const badge = document.createElement("div");
                badge.className = "qr-badge";
                badge.textContent = `QR ${partIndex} of ${totalParts}`;
                card.appendChild(badge);

                // Clear Amount Display
                const amountText = document.createElement("div");
                amountText.className = "qr-amount";
                amountText.textContent = `QR ${partIndex}: ${formatCurrency(chunkAmount)}`;
                card.appendChild(amountText);

                // Container for QR Code rendering
                const canvasContainer = document.createElement("div");
                canvasContainer.className = "qr-canvas-container";
                
                const qrElement = document.createElement("div");
                qrElement.id = `qrcode-${index}`;
                canvasContainer.appendChild(qrElement);
                card.appendChild(canvasContainer);

                // UPI Payload URI Display Box
                const detailsBox = document.createElement("div");
                detailsBox.className = "qr-details";

                const detailsTitle = document.createElement("div");
                detailsTitle.className = "qr-details-title";
                detailsTitle.textContent = "UPI Link Payload";

                const detailsUri = document.createElement("div");
                detailsUri.className = "qr-uri";
                detailsUri.textContent = fullUpiUri;

                detailsBox.appendChild(detailsTitle);
                detailsBox.appendChild(detailsUri);
                card.appendChild(detailsBox);

                // Append Card to Vertical Stack
                qrStack.appendChild(card);

                // Render pure client-side QR code canvas
                new QRCode(qrElement, {
                    text: fullUpiUri,
                    width: 200,
                    height: 200,
                    colorDark: "#0f172a",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            });
        }
    </script>
</body>
</html>
